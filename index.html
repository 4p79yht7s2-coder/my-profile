<!doctype html><html lang="ru"><head>  <meta charset="utf-8">  <meta name="viewport" content="width=device-width, initial-scale=1">  <title>Татьяна Чупарнова — психолог</title>  <link rel="preconnect" href="https://fonts.googleapis.com">  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">  <style>    :root { --ink: #363642; --muted: #6d6c7b; --paper: rgba(255,255,255,.84); --accent: #8a718f; --accent-soft: #eee4ef; --line: #e8e0e9; --wash: #f5f0f7; }    * { box-sizing: border-box; }    body { margin: 0; background: radial-gradient(circle at 9% 8%, #fbf4f7 0, transparent 31%), radial-gradient(circle at 93% 20%, #eaf2ef 0, transparent 29%), var(--wash); color: var(--ink); font: 17px/1.72 "Nunito Sans", "Avenir Next", sans-serif; }    main { max-width: 900px; margin: 0 auto; padding: 64px 24px 80px; }    header { display: grid; grid-template-columns: 1fr 250px; align-items: center; gap: 42px; margin-bottom: 46px; }    h1, h2 { font-family: "Cormorant Garamond", Georgia, serif; letter-spacing: -.025em; }    h1 { margin: 0; font-size: 48px; line-height: 1.1; font-weight: 600; }    h2 { margin: 0 0 16px; font-size: 31px; line-height: 1.2; font-weight: 600; }    .lead, .meta { color: var(--muted); }    .lead { font-size: 20px; margin: 15px 0 0; }    .meta { margin: 5px 0 0; }    section { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 34px; margin: 22px 0; box-shadow: 0 14px 36px rgba(89, 72, 98, .06); }    h3 { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; margin: 30px 0 10px; text-transform: uppercase; }    h3:first-of-type { margin-top: 0; }    ul { margin: 8px 0; padding-left: 22px; }    li + li { margin-top: 4px; }    a { color: var(--accent); }    .approach { background: linear-gradient(135deg, rgba(247,240,247,.96), rgba(239,246,242,.96)); }    .approach p:last-child { margin-bottom: 0; }    .contact-section { text-align: center; }    .contact-section p { color: var(--muted); margin: 0 auto 22px; max-width: 560px; }    .contacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }    .contact-link { min-width: 230px; padding: 14px 22px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-weight: 700; text-decoration: none; transition: .2s ease; }    .contact-link:hover { background: var(--accent); color: white; transform: translateY(-2px); box-shadow: 0 10px 24px rgba(138,113,143,.2); }    .portrait { width: 250px; aspect-ratio: 1; object-fit: cover; object-position: center 21%; border-radius: 50%; box-shadow: 0 16px 38px rgba(83, 72, 94, .16); border: 6px solid rgba(255,255,255,.62); }    @media (max-width: 600px) { main { padding-top: 38px; } header { grid-template-columns: 1fr; gap: 24px; } .portrait { width: 180px; grid-row: 1; } h1 { font-size: 36px; } section { padding: 25px; } }
